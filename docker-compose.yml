services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: yii2_book_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    networks:
      - book_net

  web:
    image: nginx:alpine
    container_name: yii2_book_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - book_net

  db:
    image: mariadb:10.6
    container_name: yii2_book_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: book_catalog
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - book_net

volumes:
  db_data:

networks:
  book_net:
